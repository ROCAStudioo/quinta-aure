<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bebidas — Cola de Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080a0d;--surface:#111318;--surface2:#191c23;--border:#242830;--accent:#3b82f6;--accent2:#ef4444;--green:#22c55e;--text:#e8eaf0;--muted:#5a6270;--radius:14px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow:hidden}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:var(--accent)}
  .header-info{display:flex;align-items:center;gap:32px}
  .stat-item{text-align:center}.stat-value{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--accent)}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
  .clock{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--muted);letter-spacing:2px}
  .status-indicator{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.online{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .main{height:calc(100vh - 64px);overflow-y:auto;padding:24px 32px}
  .cola-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px}
  .orden-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .card-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface2)}
  .card-mesa{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;color:var(--accent)}
  .card-mesero{font-size:14px;color:var(--muted)}
  .card-items{padding:16px 22px}
  .card-item{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
  .card-item:last-child{border-bottom:none}
  .item-emoji{font-size:36px}.item-text{flex:1}.item-nombre{font-size:20px;font-weight:600}
  .item-qty{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--muted)}
  .empty-state{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
  .empty-icon{font-size:80px;margin-bottom:20px;opacity:.3}
  .empty-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:3px;color:var(--muted)}
  .empty-sub{font-size:15px;color:var(--muted)}
  .config-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
  .config-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:480px}
  .config-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;color:var(--accent);margin-bottom:8px}
  .config-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
  .config-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;color:var(--text);font-size:14px;width:100%;margin-bottom:16px;outline:none}
  .config-input:focus{border-color:var(--accent)}
  .btn{width:100%;padding:16px;border-radius:var(--radius);border:none;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;background:var(--accent);color:#fff}
</style>
</head>
<body>

<div class="config-overlay" id="authOverlay">
  <div class="config-box">
    <div class="config-title">🔒 ACCESO RESTRINGIDO</div>
    <div class="config-sub">Ingresa la contraseña para acceder.</div>
    <input class="config-input" id="authInput" placeholder="Contraseña" type="password" onkeydown="if(event.key==='Enter') verificarAuth()">
    <div id="authError" style="color:#ef4444;font-size:12px;margin-bottom:12px;display:none">Contraseña incorrecta</div>
    <button class="btn" onclick="verificarAuth()">ENTRAR</button>
  </div>
</div>
<div class="config-overlay" id="configOverlay" style="display:none">
  <div class="config-box">
    <div class="config-title">🥤 PANTALLA BEBIDAS</div>
    <div class="config-sub">Ingresa la URL de Firebase.</div>
    <input class="config-input" id="firebaseUrl" placeholder="https://tu-proyecto-default-rtdb.firebaseio.com" type="url">
    <button class="btn" onclick="guardarConfig()">CONECTAR</button>
  </div>
</div>

<header>
  <div class="logo">🥤 BEBIDAS</div>
  <div class="header-info">
    <div class="stat-item"><div class="stat-value" id="countPendientes">0</div><div class="stat-label">En cola</div></div>
    <div class="clock" id="clock">00:00</div>
    <div class="status-indicator"><div class="dot" id="dot"></div><span id="statusText">Conectando...</span></div>
  </div>
</header>

<div id="offlineBannerB" style="display:none;background:rgba(239,68,68,.15);border-bottom:2px solid #ef4444;padding:10px 32px;align-items:center;gap:10px;font-size:14px;color:#ef4444;font-weight:600">⚠ Sin conexión a Firebase — esperando reconexión...</div>
<div class="main" id="main">
  <div class="empty-state" id="emptyState"><div class="empty-icon">🥤</div><div class="empty-title">SIN PEDIDOS</div><div class="empty-sub">Los pedidos de bebidas aparecerán aquí</div></div>
  <div class="cola-grid" id="colaGrid"></div>
</div>

<script>
function verificarAuth(){
  if(document.getElementById('authInput').value==='Quinta26'){
    sessionStorage.setItem('auth_bebidas','1');
    document.getElementById('authOverlay').style.display='none';
    window.__authReady=true;
    if(window.__initFirebase)window.__initFirebase();
  }else{document.getElementById('authError').style.display='block';document.getElementById('authInput').value='';}
}
if(sessionStorage.getItem('auth_bebidas')==='1'){document.getElementById('authOverlay').style.display='none';window.__authReady=true;}
else{document.getElementById('authOverlay').style.display='flex';window.__authReady=false;}
</script>

<script type="module">
import { initializeApp } from 'https://cdn.jsdelivr.net/npm/firebase@10.12.0/app/+esm';
import { getDatabase, ref, onValue } from 'https://cdn.jsdelivr.net/npm/firebase@10.12.0/database/+esm';

let db=null,ordenes={};

window.guardarConfig=function(){
  const url=document.getElementById('firebaseUrl').value.trim();
  if(!url.includes('firebaseio.com')){alert('URL inválida');return;}
  localStorage.setItem('firebaseUrlBebidas',url);
  document.getElementById('configOverlay').style.display='none';
  initFirebase();
}

function initFirebase(){
  const url=localStorage.getItem('firebaseUrlBebidas');
  if(!url){document.getElementById('configOverlay').style.display='flex';return;}
  document.getElementById('configOverlay').style.display='none';
  const app=initializeApp({databaseURL:url},'bebidas');
  db=getDatabase(app);
  onValue(ref(db,'.info/connected'),snap=>{
    const dot=document.getElementById('dot'),txt=document.getElementById('statusText');
    if(snap.val()){dot.className='dot online';txt.textContent='En línea';document.getElementById('offlineBannerB').style.display='none';}
    else{dot.className='dot';txt.textContent='Sin conexión';document.getElementById('offlineBannerB').style.display='flex';}
  });
  escuchar();
}

function toArray(v){if(!v)return[];if(Array.isArray(v))return v;return Object.values(v);}

function escuchar(){
  onValue(ref(db,'bebidas'),snap=>{
    ordenes={};
    snap.forEach(ch=>{
      const o=ch.val();
      if(o.estado!=='cobrada'&&o.estado!=='cancelada'&&o.estado!=='cuenta-enviada'){
        const items=toArray(o.items);o.items=items;
        const tienePendientes=items.length>0&&items.some(i=>!i.entregado);
        if(tienePendientes){
          ordenes[ch.key]=o;
        }
      }
    });
    const newCount=Object.keys(ordenes).length;
    if(!primeraVezB && newCount>prevCount) playBeep();
    primeraVezB=false;
    prevCount=newCount;
    render();
    document.getElementById('countPendientes').textContent=newCount;
  });
}

let primeraVezB=true,prevCount=0;

function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=880;osc.type='sine';
    gain.gain.setValueAtTime(0.3,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.5);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.5);
    setTimeout(()=>{
      const osc2=ctx.createOscillator();const gain2=ctx.createGain();
      osc2.connect(gain2);gain2.connect(ctx.destination);
      osc2.frequency.value=1100;osc2.type='sine';
      gain2.gain.setValueAtTime(0.3,ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.5);
      osc2.start(ctx.currentTime);osc2.stop(ctx.currentTime+0.5);
    },300);
  }catch(e){}
}

function render(){
  const grid=document.getElementById('colaGrid'),empty=document.getElementById('emptyState');
  const lista=Object.values(ordenes).sort((a,b)=>a.timestamp-b.timestamp);
  if(lista.length===0){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=lista.map(o=>`
    <div class="orden-card">
      <div class="card-header">
        <div class="card-mesa">MESA ${o.mesa}</div>
        <div class="card-mesero">👤 ${o.mesero}</div>
      </div>
      ${o.nota?'<div style="padding:14px 22px;font-size:18px;font-weight:600;color:#3b82f6;background:rgba(59,130,246,.1);border-bottom:2px solid rgba(59,130,246,.3)">📝 '+o.nota+'</div>':''}
      <div class="card-items">
        ${o.items.map(i=>`<div class="card-item">
          <div class="item-emoji">${i.emoji}</div>
          <div class="item-text"><div class="item-nombre">${i.nombre}</div></div>
          <div class="item-qty">x${i.qty}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
setInterval(updateClock,1000);updateClock();

window.__initFirebase=initFirebase;
if(window.__authReady)initFirebase();
</script>
</body>
</html>
